name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR; never cancel release tag builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GHCR_IMAGE: crjeder/spoolman-light

jobs:
  #
  # Rust lint (clippy also type-checks)
  #
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy
        run: cargo clippy -p spoolman-types -p spoolman-server -- -D warnings

  #
  # Build native image
  # Only runs on PRs to validate the build
  #
  build-amd64:
    if: ${{ github.event_name == 'pull_request' }}
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.6.1

      - name: Build Spoolman (PR)
        uses: docker/build-push-action@v6.7.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  #
  # Release images to GHCR and Docker Hub
  # Only runs on: push to master, git tags, or manual workflow_dispatch
  #
  publish-images:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.6.1

      - name: Log in to the Github Container registry
        uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # edge: every push to master. semver tags + latest: v* tag pushes only.
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5.5.1
        with:
          images: |
            ghcr.io/${{ env.GHCR_IMAGE }}
            docker.io/${{ vars.DOCKERHUB_USERNAME }}/spoolman-light
          tags: |
            type=edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker images
        uses: docker/build-push-action@v6.7.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          # Synology Container Manager can't parse the attestation manifests buildx adds by default
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  #
  # Create draft Github Release if CI was triggered by a tag
  #
  publish-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [publish-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
