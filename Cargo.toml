[workspace]
resolver = "2"
members = [
    "crates/spoolman-types",
    "crates/spoolman-server",
    "crates/spoolman-client",
]

[[workspace.metadata.leptos]]
# The name of the project (must match the server binary name).
name = "spoolman-server"
bin-package = "spoolman-server"
lib-package = "spoolman-client"
style-file = "style/spoolman.css"

# Shared dependency versions for the entire workspace
[workspace.dependencies]
leptos = { version = "0.9.0-rc0", features = ["csr"] }
leptos_router = "0.9.0-rc0"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

# cargo-leptos places compiled WASM assets here.
site-root = "target/site"
site-pkg-dir = "pkg"

# Static assets directory — cargo-leptos copies this into site-root.
assets-dir = "assets"

# Dev server address (used by `cargo leptos watch`).
site-addr = "127.0.0.1:3000"
reload-port = 3001

# CSS browserlist target.
browserquery = "defaults"

env = "DEV"


bin-features = []
bin-default-features = true
lib-features = []
lib-default-features = true
