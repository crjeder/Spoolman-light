[package]
name = "spoolman-client"
version = "1.10.1"
edition = "2021"

[[bin]]
name = "spoolman-client-bin"
path = "src/main.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
spoolman-types = { path = "../spoolman-types" }
leptos = { workspace = true }          # Inherits version from workspace
leptos_router = { workspace = true }    # Inherits version from workspace
serde = { workspace = true }
wasm-bindgen = "0.2"                   # Crate-specific, not shared
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage", "HtmlInputElement", "FileList", "File", "Document", "Element", "HtmlElement", "EventTarget"] }
serde_json = "1"
gloo-net = { version = "0.7", features = ["http"] }
console_error_panic_hook = "0.1"
deltae = "0.3.2"
oklab = "1.1"
chrono = { version = "0.4", features = ["serde"] }
gloo-file = { version = "0.4.0", features = ["futures"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
